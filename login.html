<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Fr. CRCE Placement Cell</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #f1b335;
            --dark-blue: #0a192f;
            --section-bg: #0d1e36;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --text-light: #ffffff;
            --text-dim: #ccd6f6;
            --error: #ef5350;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            overflow: hidden;
        }

        .login-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(10, 25, 47, 0.95), rgba(13, 30, 54, 0.9)),
                url('college2.webp') center/cover;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }

        .login-card {
            background: rgba(13, 30, 54, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header img {
            height: 70px;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .login-header p {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .material-icons-outlined {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--text-dim);
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 46px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(241, 179, 53, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(204, 214, 246, 0.4);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.82rem;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            accent-color: var(--primary-gold);
            width: 15px;
            height: 15px;
        }

        .form-options a {
            color: var(--primary-gold);
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--primary-gold);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(241, 179, 53, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-footer a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--primary-gold);
        }

        .error-msg {
            color: var(--error);
            font-size: 0.78rem;
            margin-top: 0.4rem;
            display: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .login-container {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-bg"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="HEADER_LOGO.png" alt="CRCE Logo">
                <h1>Fr. CRCE Placement Cell</h1>
                <p>Student Portal Login</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">email</span>
                        <input type="email" id="email" placeholder="student@crce.edu.in" required>
                    </div>
                    <p class="error-msg" id="emailError">Please enter a valid email address</p>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">lock</span>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <p class="error-msg" id="passwordError">Password must be at least 6 characters</p>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="index.html">
                    <span class="material-icons-outlined" style="font-size:18px;">arrow_back</span>
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            let valid = true;

            if (!email || !email.includes('@')) {
                document.getElementById('emailError').style.display = 'block';
                valid = false;
            } else {
                document.getElementById('emailError').style.display = 'none';
            }

            if (!password || password.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                valid = false;
            } else {
                document.getElementById('passwordError').style.display = 'none';
            }

            if (valid) {
                // Store mock user session
                const user = {
                    name: email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                    email: email,
                    loggedIn: true
                };
                localStorage.setItem('crce_user', JSON.stringify(user));
                window.location.href = 'student-portal.html';
            }
        }
    </script>
</body>

</html>
